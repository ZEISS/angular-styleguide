<button class="theme-switcher" (click)="switcherClicked()">
  @switch (theme) {
    @case ('light-theme') {
      <fa-icon [icon]="faMoon"></fa-icon>
    }
    @case ('dark-theme') {
      <fa-icon [icon]="faSun"></fa-icon>
    }
  }
</button>
