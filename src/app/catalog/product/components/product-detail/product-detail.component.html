@if (product$ | async; as product) {
  <header>
    <div class="nav-container">
      <app-theme-switcher></app-theme-switcher>
      <button class="feedback-button" (click)="navigateToFeedback()" title="Feedback">
        <fa-icon [icon]="faComment"></fa-icon>
      </button>
    </div>
    <h1>{{ product.title }}</h1>
  </header>
}

<div class="container">
  <div class="row">
    @if (product$ | async; as product) {
      <div class="product-details">
        <img class="product-img" src="{{ product.image }}" alt="product image" />

        <div class="product-description">
          <h2>{{ product.title }}</h2>

          <h3>Price</h3>
          <p>{{ product.price }} €</p>

          <div class="product-number-container">
            <h3>Number of items</h3>
            <button class="counter-button" (click)="decreaseProductNumber()">-</button>
            <span class="product-number">{{ productNumber() }}</span>
            <button class="counter-button" (click)="increseProductNumber()">+</button>
          </div>

          <h3>Ingredients</h3>
          <p>{{ product.description }}</p>

          <div class="button-container">
            <button (click)="addToCart()">Add to cart</button>
          </div>
        </div>
      </div>
      <app-back-to-all-products />
    }
  </div>
</div>
<app-recommendations></app-recommendations>
