<header>
  <div class="nav-container">
    <app-theme-switcher></app-theme-switcher>
    <button class="feedback-button" (click)="navigateToFeedback()" title="Feedback">
      <fa-icon [icon]="faComment"></fa-icon>
    </button>
  </div>
  <div id="confirmation-info">
    <h1>Order confirmed.</h1>
    <h2>Your ice cream is on its way to you.</h2>
  </div>
</header>
<div class="container">
  <div class="row">
    @if (purchasedProducts; as products) {
      <div class="purchased-products">
        <h2>Purchased Products</h2>
        <div class="items">
          @for (product of products; track product) {
            <div class="item">
              <img [attr.src]="product.image" />
              <span>{{ product.title }}</span>
              <span>{{ product.price }} €</span>
              <span>X {{ product.count }}</span>
            </div>
          }
        </div>
      </div>
    }
    <app-back-to-all-products />
  </div>
</div>
